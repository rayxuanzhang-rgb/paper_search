name: Collect research
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      backfill_windows:
        description: 'Historical seven-day windows per query (5 completes the initial 30 days)'
        type: choice
        options: ['1', '5']
        default: '1'
permissions:
  contents: read
concurrency:
  group: research-catalog
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-public.txt
      - name: Collect public metadata
        id: collect
        continue-on-error: true
        env:
          BACKFILL_WINDOWS: ${{ inputs.backfill_windows || '1' }}
        run: python collect.py --backfill-windows "$BACKFILL_WINDOWS"
      - name: Save catalog and per-query progress
        if: always()
        run: |
          if [ -d data ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/catalog.json data/collection_state.json data/collection_health.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update public research catalog'
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-health
          path: data/collection_health.json
          retention-days: 14
          if-no-files-found: warn
      - name: Surface incomplete collection
        if: steps.collect.outcome != 'success'
        run: exit 1
