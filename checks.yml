name: Checks
on:
  push:
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-public.txt
      - run: python -m unittest discover -s tests -p 'test_codex_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_discovery.py' -v
